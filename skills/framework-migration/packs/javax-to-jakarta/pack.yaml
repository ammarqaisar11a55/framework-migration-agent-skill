id: javax-to-jakarta
title: Java EE (javax.*) → Jakarta EE 10 (jakarta.*)
ecosystem: jvm
tier: 1
status: shipped

from: { framework: javax, versions: "*" }
to:   { framework: jakarta, versions: "10" }

tools:
  # Invoked by full coordinates by codemods/openrewrite.mjs; nothing is added to the project's pom.
  - { name: "org.openrewrite.maven:rewrite-maven-plugin", version: "6.46.1", role: engine }
  - { name: "org.openrewrite.recipe:rewrite-migrate-java", version: "3.42.1", role: engine }
  # Jakarta EE 10 artifacts jakarta-implementations.js puts in place of javax-era ones the recipe leaves.
  - { name: "org.hibernate.validator:hibernate-validator", version: "8.0.5.Final", role: dependency }
  - { name: "org.glassfish.expressly:expressly", version: "5.0.0", role: dependency }
  - { name: "org.eclipse.parsson:parsson", version: "1.1.7", role: dependency }
  - { name: "org.glassfish.jaxb:jaxb-runtime", version: "4.0.5", role: dependency }
  - { name: "com.google.inject:guice", version: "7.0.0", role: dependency }
  - { name: "jakarta.json:jakarta.json-api", version: "2.1.3", role: dependency }
  - { name: "jakarta.inject:jakarta.inject-api", version: "2.0.1", role: dependency }
  # API versions the recipe chooses at run time ("newest 3.0.x", ...), pinned for reproducibility.
  - { name: "jakarta.validation:jakarta.validation-api", version: "3.0.2", role: dependency }
  - { name: "jakarta.xml.bind:jakarta.xml.bind-api", version: "4.0.5", role: dependency }
  - { name: "jakarta.annotation:jakarta.annotation-api", version: "2.1.1", role: dependency }
  - { name: "jakarta.servlet:jakarta.servlet-api", version: "6.0.0", role: dependency }
  - { name: "jakarta.persistence:jakarta.persistence-api", version: "3.1.0", role: dependency }
  - { name: "jakarta.el:jakarta.el-api", version: "5.0.1", role: dependency }

stages:
  - id: jakarta-ee-10
    title: Run OpenRewrite's JakartaEE10 (packages, API artifacts, XML descriptors), then move implementations to Jakarta
    commands:
      - run: "node {pack_dir}/codemods/openrewrite.mjs org.openrewrite.java.migrate.jakarta.JakartaEE10"
        dry_run: "node {pack_dir}/codemods/openrewrite.mjs org.openrewrite.java.migrate.jakarta.JakartaEE10 --dry-run"
    codemods: [jakarta-implementations.js]
    fix_rules: true

checks:
  typecheck: "mvn -B -q test-compile"
  test: "mvn -B test"
