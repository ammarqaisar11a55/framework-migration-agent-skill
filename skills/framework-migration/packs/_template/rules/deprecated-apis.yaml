# Rules that detect deprecated or migration-relevant APIs. Validated by schemas/rules.schema.json.
#
# matcher.type: regex — `pattern` (JavaScript regex source) is matched against every
#                       source file, line by line; add `flags` (i, m, s, u) if needed.
# matcher.type: ast   — `selector` is an esquery selector run over the file's ESTree AST (JS/TS only).
# auto_fixable: true only if a codemod in this pack fixes the finding without human judgement.
# exclude:      optional, top level or per rule — regexes over the project-relative path; matching
#               files are not scanned. List the files this pack's codemods never touch, so they are
#               not reported as auto-fixable.
rules:
  - id: example-deprecated-call
    description: oldApi() was removed in example-framework 2.
    matcher: { type: ast, selector: 'CallExpression[callee.name="oldApi"]' }
    severity: error                # info | warn | error
    auto_fixable: true
    fix_hint: Replace oldApi() with newApi().
    docs_url: https://example.com/migration-guide#old-api
