id: express-4-to-5
title: Express 4 → Express 5
ecosystem: node
tier: 1
status: shipped

from: { framework: express, versions: "4.x" }
to:   { framework: express, versions: "5.x" }

tools:
  # The official codemods, run from source at this commit (codemods/official-recipe.mjs).
  - name: "@expressjs/v5-migration-recipe"
    version: "1.1.0"
    source: https://github.com/expressjs/codemod
    ref: 2f7f1e5f31ebab6e840957b0cf171a014ad7a3b9
    role: engine
  - { name: codemod, version: "1.18.3", role: engine }
  # Verified with this release; the recipe writes "^5.0.0" to package.json.
  - { name: express, version: "5.3.0" }

stages:
  - id: api-codemods
    title: Replace the APIs Express 5 removes, with the official codemods (the result still runs on Express 4)
    commands:
      - run: "node {pack_dir}/codemods/official-recipe.mjs --part api"
        dry_run: "node {pack_dir}/codemods/official-recipe.mjs --part api --dry-run"
    codemods: [route-del.js, accepts-plural.js]
    post_commands: ["npm install"]
  - id: preserve-defaults
    title: Pin the Express 4 defaults that Express 5 changes (query parser, urlencoded extended), still on Express 4
    codemods: [query-parser.js, urlencoded-extended.js]
  - id: upgrade
    title: Upgrade express and its packages to v5, and rewrite route paths to the new syntax
    commands:
      - run: "node {pack_dir}/codemods/official-recipe.mjs --part dependencies"
        dry_run: "node {pack_dir}/codemods/official-recipe.mjs --part dependencies --dry-run"
    codemods: [path-syntax.js]
    fix_rules: true
    post_commands: ["npm install"]

checks:
  test: "npm test"
  smoke:
    start: "npm start"
    url: "http://127.0.0.1:{port}/"
    timeout_ms: 60000
