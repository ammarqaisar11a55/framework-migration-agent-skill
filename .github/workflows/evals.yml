name: evals

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  evals:
    name: Pack evals
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      # Python packs: each fixture gets a virtualenv. 3.12 is the newest Python Django 4.2 supports.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # JVM packs: Maven builds the fixtures and runs OpenRewrite on JDK 21.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # PHP packs: the runner image ships PHP 8.3 and Composer.
      - run: php --version && composer --version
      - run: npm ci
      # Every shipped pack's fixtures through the real pipeline; fails unless all pass.
      - run: npm run evals
      - name: Scorecard is up to date
        run: git diff --exit-code evals/scorecard.md
      - if: always()
        run: cat evals/scorecard.md >> "$GITHUB_STEP_SUMMARY"
